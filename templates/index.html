<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Controle de Caixa</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>
                <i data-lucide="wallet"></i>
                Controle de Caixa
            </h1>

            <div class="header-info">
                <span id="data"></span>
                <span id="hora"></span>
            </div>
        </header>

        <main class="grid">

            <section class="card">

                <h2>
                    <i data-lucide="shopping-cart"></i>
                    Nova Venda
                </h2>

                <label for="valor">Valor da compra</label>

                <div class="input-group">
                    <input type="number"
                        id="valor"
                        placeholder="0.00"
                        step="0.01">

                    <span>R$</span>
                </div>

                <label for="pagamento">Forma de pagamento</label>

                <select id="pagamento">
                    <option value="dinheiro">Dinheiro</option>
                    <option value="debito">Débito</option>
                    <option value="credito">Crédito</option>
                    <option value="pix">PIX</option>
                </select>

                <div id="campo-extra"></div>

                <button id="botao-venda">
                    Confirmar Venda
                </button>

                <div id="mensagem"></div>

            </section>

            <section class="card">

                <h2>
                    <i data-lucide="credit-card"></i>
                    Resumo do Caixa
                </h2>

                <div class="saldo-box">
                    <span>Total em Caixa</span>
                    <h1 id="saldo">R$ 0,00</h1>
                </div>

                <div class="cards-resumo">

                    <div class="mini-card dinheiro">
                        <span>Dinheiro</span>
                        <strong id="dinheiro">R$ 0,00</strong>
                    </div>

                    <div class="mini-card cartao">
                        <span>Cartão</span>
                        <strong id="cartao">R$ 0,00</strong>
                    </div>

                    <div class="mini-card pix">
                        <span>PIX</span>
                        <strong id="pix">R$ 0,00</strong>
                    </div>

                </div>

            </section>

        </main>

        <section class="card historico-card">

            <h2>
                <i data-lucide="history"></i>
                Histórico de Vendas
            </h2>

            <div class="table-container">

                <table class="tabela">

                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Pagamento</th>
                            <th>Detalhes</th>
                            <th>Valor</th>
                        </tr>
                    </thead>

                    <tbody id="historico"></tbody>

                </table>

            </div>

        </section>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
